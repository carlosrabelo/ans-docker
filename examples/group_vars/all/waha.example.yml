---
# Configurações do WAHA
# WhatsApp HTTP API para automação

# =================================================================
# CONFIGURAÇÕES BÁSICAS
# =================================================================

# Fuso horário (herda do timezone global)
waha_timezone: "{{ timezone }}"

# =================================================================
# CONFIGURAÇÕES DE DOMÍNIO
# =================================================================

waha_domain: "waha.example.local"

# =================================================================
# CONFIGURAÇÕES DE DIRETÓRIOS
# =================================================================

waha_data_dir: "/opt/data/waha"
waha_make_dir: "/opt/make/waha"

# =================================================================
# CONFIGURAÇÕES DE USUÁRIOS (UID/GID)
# =================================================================

waha_uid: 1000
waha_gid: 1000

# =================================================================
# CONFIGURAÇÕES DE PORTAS
# =================================================================

waha_port: 3000

# =================================================================
# CONFIGURAÇÕES DE CONTAINER
# =================================================================

waha_container_name: waha-server
waha_image: waha:latest
waha_restart_policy: unless-stopped
waha_service_name: waha

# =================================================================
# CONFIGURAÇÕES DE AUTENTICAÇÃO
# =================================================================

waha_dashboard_password: "{{ vault_waha_dashboard_password }}"

# =================================================================
# CONFIGURAÇÕES DE VERSÃO
# =================================================================

waha_version: "latest"
