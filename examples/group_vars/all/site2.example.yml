---
# Configurações do Site 2
# Aplicação web personalizada

# =================================================================
# CONFIGURAÇÕES BÁSICAS
# =================================================================

# Fuso horário (herda do timezone global)
site2_timezone: "{{ timezone }}"

# =================================================================
# CONFIGURAÇÕES DE DIRETÓRIOS
# =================================================================

site2_data_dir: "/opt/data/site2"
site2_make_dir: "/opt/make/site2"

# =================================================================
# CONFIGURAÇÕES DE USUÁRIOS (UID/GID)
# =================================================================

site2_uid: 1000
site2_gid: 1000

# =================================================================
# CONFIGURAÇÕES DE CONTAINER
# =================================================================

site2_restart_policy: unless-stopped
