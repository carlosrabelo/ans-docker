server {
    listen 443 ssl;
    http2 on;
    server_name wiki.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_bookstack bookstack-app;
        proxy_pass http://$upstream_bookstack:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}
