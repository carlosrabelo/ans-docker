---
- name: Ensure waha data directory exists
  ansible.builtin.file:
    path: "{{ waha_data_dir }}"
    state: directory
    mode: '0755'
  tags:
    - waha
    - up

- name: Ensure waha subdirectories exist and have correct permissions
  ansible.builtin.file:
    path: "{{ waha_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ waha_uid }}"
    group: "{{ waha_gid }}"
    mode: '0775'
    recurse: true
  loop:
    - sessions
    - config
  tags:
    - waha
    - up

- name: Copy nginx configuration
  ansible.builtin.copy:
    src: "nginx/waha.conf"
    dest: "{{ nginx_data_dir }}/conf.d/"
    mode: '0644'
  when: service_state == 'present'
  notify: reload nginx

- name: Remove nginx configuration
  ansible.builtin.file:
    path: "{{ nginx_data_dir }}/conf.d/waha.conf"
    state: absent
  when: service_state == 'absent'
  notify: reload nginx

- name: Ensure waha make directory exists
  ansible.builtin.file:
    path: "{{ waha_make_dir }}"
    state: directory
    mode: '0755'

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ waha_make_dir }}/docker-compose.yml"
    mode: '0644'
    force: true
  tags:
    - waha
    - up

- name: Check if docker network exists
  ansible.builtin.command: docker network inspect {{ ansible_hostname }}-net
  register: network_check
  failed_when: false
  changed_when: false
  tags:
    - waha
    - up

- name: Create external docker network
  ansible.builtin.command: docker network create {{ ansible_hostname }}-net
  when: network_check.rc != 0
  tags:
    - waha
    - up

- name: Pull docker images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ waha_make_dir }}"
  when: service_state != 'absent'
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stdout"
  tags:
    - waha
    - up

- name: Start/Stop waha service
  community.docker.docker_compose_v2:
    project_src: "{{ waha_make_dir }}"
    state: "{{ service_state | default('present') }}"
    pull: missing
  register: waha_result
  failed_when: waha_result.failed and "No resource found to remove" not in waha_result.msg
  tags:
    - waha
    - up
    - down
    - restart