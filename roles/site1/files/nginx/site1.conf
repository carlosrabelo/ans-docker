server {
    listen 443 ssl;
    http2 on;
    server_name www.ccbv.local ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_site1 site1-app;
        proxy_pass http://$upstream_site1:80;
    }

    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}
