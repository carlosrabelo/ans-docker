server {
    listen 443 ssl;
    http2 on;
    server_name painel.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_site2 site2-app;
        proxy_pass http://$upstream_site2:80;
    }

    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}
