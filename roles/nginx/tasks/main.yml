---
- name: Validate required variables
  ansible.builtin.fail:
    msg: "Required variable {{ item }} is not defined"
  when: vars[item] is not defined
  loop:
    - nginx_data_dir
    - nginx_make_dir
    - ansible_hostname

- name: Setup Nginx
  block:
    - name: Ensure nginx data directory exists
      ansible.builtin.file:
        path: "{{ nginx_data_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure subdirectories exist
      ansible.builtin.file:
        path: "{{ nginx_data_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - html
        - logs
        - certs

    - name: Copy static files to html
      ansible.builtin.copy:
        src: "html/{{ item }}"
        dest: "{{ nginx_data_dir }}/html/"
        mode: '0644'
      loop:
        - index.html
        - 404.html
        - 500.html
        - 503.html

    - name: Check if certificates exist
      ansible.builtin.stat:
        path: /etc/mycerts/ccbv.local.crt
      register: cert_crt
      delegate_to: localhost

    - name: Check if certificate key exists
      ansible.builtin.stat:
        path: /etc/mycerts/ccbv.local.key
      register: cert_key
      delegate_to: localhost

    - name: Fail if certificates are missing
      ansible.builtin.fail:
        msg: "SSL certificates not found in /etc/mycerts/ (checked on localhost)"
      when: not cert_crt.stat.exists or not cert_key.stat.exists

    - name: Copy certificates
      ansible.builtin.copy:
        src: /etc/mycerts/
        dest: "{{ nginx_data_dir }}/certs/"
        mode: '0600'

    - name: Ensure conf.d directory exists
      ansible.builtin.file:
        path: "{{ nginx_data_dir }}/conf.d"
        state: directory
        mode: '0755'

    - name: Copy default configuration
      ansible.builtin.copy:
        src: "conf/default.conf"
        dest: "{{ nginx_data_dir }}/conf.d/"
        mode: '0644'

    - name: Copy nginx.conf
      ansible.builtin.copy:
        src: conf/nginx.conf
        dest: "{{ nginx_data_dir }}/nginx.conf"
        mode: '0644'

    - name: Validate nginx configuration
      ansible.builtin.command: docker run --rm \
        -v {{ nginx_data_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro \
        -v {{ nginx_data_dir }}/conf.d:/etc/nginx/conf.d:ro \
        -v {{ nginx_data_dir }}/certs:/etc/nginx/certs:ro \
        -v {{ nginx_data_dir }}/logs:/var/log/nginx \
        -v {{ nginx_data_dir }}/html:/usr/share/nginx/html/html:ro \
        nginx:alpine nginx -t
      register: nginx_validation
      failed_when: nginx_validation.rc != 0
      changed_when: false

    - name: Ensure nginx make directory exists
      ansible.builtin.file:
        path: "{{ nginx_make_dir }}"
        state: directory
        mode: '0755'

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ nginx_make_dir }}/docker-compose.yml"
        mode: '0644'
        force: true

    - name: Check if docker network exists
      ansible.builtin.command: docker network inspect {{ ansible_hostname }}-net
      register: network_check
      failed_when: false
      changed_when: false

    - name: Create external docker network
      ansible.builtin.command: docker network create {{ ansible_hostname }}-net
      when: network_check.rc != 0

    - name: Pull docker images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ nginx_make_dir }}"
      register: pull_result
      changed_when: "'Downloaded' in pull_result.stdout"
      tags:
        - nginx
        - up

  when: service_state != 'absent'

- name: Start/Stop nginx service
  community.docker.docker_compose_v2:
    project_src: "{{ nginx_make_dir }}"
    state: "{{ service_state | default('present') }}"
    pull: missing
  register: nginx_result
  failed_when: nginx_result.failed and "No resource found to remove" not in nginx_result.msg
  tags:
    - nginx
    - up
    - down
    - restart
