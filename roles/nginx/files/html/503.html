<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviço Indisponível</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --info-color: #667eea;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .code {
            font-size: 96px;
            font-weight: 800;
            margin: 0;
            color: var(--info-color);
            line-height: 1;
            text-shadow: 4px 4px 0px rgba(102, 126, 234, 0.1);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 28px;
            margin: 20px 0 10px;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            display: flex;
            align-items: flex-start;
        }

        .status-icon {
            font-size: 24px;
            margin-right: 15px;
            margin-top: -2px;
        }

        .status-text strong {
            display: block;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .status-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            background: var(--primary-gradient);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid #e2e8f0;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #f7fafc;
            box-shadow: none;
            transform: translateY(-2px);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🚧</div>
        <div class="code">503</div>
        <h1>Serviço em Manutenção</h1>
        <p>O serviço está temporariamente indisponível. Isso geralmente é rápido e necessário para melhorias.</p>

        <div class="status-box">
            <div class="status-icon">💡</div>
            <div class="status-text">
                <strong>O que está acontecendo?</strong>
                O container do sistema pode estar reiniciando ou sendo atualizado. Tente novamente em alguns instantes.
            </div>
        </div>

        <div class="actions">
            <button onclick="location.reload()" class="btn">Atualizar Página</button>
            <a href="/" class="btn btn-secondary">Início</a>
        </div>
    </div>
</body>

</html>
