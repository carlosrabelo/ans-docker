<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro Interno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --error-color: #ee5253;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #2d3436;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            border-top: 6px solid var(--error-color);
            animation: shake 0.8s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .code {
            font-size: 96px;
            font-weight: 800;
            margin: 0;
            color: var(--error-color);
            line-height: 1;
            text-shadow: 4px 4px 0px rgba(238, 82, 83, 0.1);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-size: 28px;
            margin: 20px 0 10px;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            background: var(--error-color);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(238, 82, 83, 0.3);
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(238, 82, 83, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            box-shadow: none;
            border: 1px solid #e2e8f0;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #f7fafc;
            box-shadow: none;
            transform: translateY(-2px);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <div class="icon">💥</div>
        <div class="code">500</div>
        <h1>Erro Interno</h1>
        <p>Algo deu errado nos nossos servidores. Nossa equipe foi notificada e estamos trabalhando para corrigir.</p>

        <div class="actions">
            <button onclick="location.reload()" class="btn">Tentar Novamente</button>
            <a href="/" class="btn btn-secondary">Início</a>
        </div>
    </div>
</body>

</html>
