server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;
    
    root /usr/share/nginx/html;

    # Force all requests to show 404 page (or specific default page)
    location / {
        return 404;
    }

    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
