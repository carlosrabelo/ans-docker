---
- name: Ensure minidlna data directory exists
  ansible.builtin.file:
    path: "{{ minidlna_data_dir }}"
    state: directory
    mode: '0755'

- name: Ensure minidlna media subdirectory exists
  ansible.builtin.file:
    path: "{{ minidlna_media_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ minidlna_uid }}"
    group: "{{ minidlna_gid }}"

- name: Ensure minidlna make directory exists
  ansible.builtin.file:
    path: "{{ minidlna_make_dir }}"
    state: directory
    mode: '0755'

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minidlna_make_dir }}/docker-compose.yml"
    mode: '0644'
    force: true

- name: Pull docker images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ minidlna_make_dir }}"
  when: service_state != 'absent'
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stdout"
  tags:
    - minidlna
    - up

- name: Start/Stop minidlna service
  community.docker.docker_compose_v2:
    project_src: "{{ minidlna_make_dir }}"
    state: "{{ service_state | default('present') }}"
    pull: missing
  register: minidlna_result
  failed_when: minidlna_result.failed and "No resource found to remove" not in minidlna_result.msg
  tags:
    - minidlna
    - up
    - down
    - restart
