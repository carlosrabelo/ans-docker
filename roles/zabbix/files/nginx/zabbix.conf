server {
    listen 443 ssl;
    http2 on;
    server_name zabbix.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_zabbix zabbix-web;
        proxy_pass http://$upstream_zabbix:8080;
    }

    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}
