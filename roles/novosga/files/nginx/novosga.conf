server {
    listen 443 ssl;
    http2 on;
    server_name novosga.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_novosga_app novosga-novosga;
        proxy_pass http://$upstream_novosga_app:8080;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name novosgap.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_novosga_display novosga-panel-app;
        proxy_pass http://$upstream_novosga_display:80;
    }
}