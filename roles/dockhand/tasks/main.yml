---
- name: Ensure dockhand data directory exists
  ansible.builtin.file:
    path: "{{ dockhand_data_dir }}"
    state: directory
    mode: '0755'

- name: Ensure dockhand subdirectories exist
  ansible.builtin.file:
    path: "{{ dockhand_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
    owner: "1001"
    group: "1001"
  loop:
    - stacks
    - data

- name: Ensure dockhand make directory exists
  ansible.builtin.file:
    path: "{{ dockhand_make_dir }}"
    state: directory
    mode: '0755'

- name: Generate docker-compose.yml for dockhand
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dockhand_make_dir }}/docker-compose.yml"
    mode: '0644'
    force: true

- name: Check if docker network exists
  ansible.builtin.command: docker network inspect {{ dockhand_network_name }}
  register: network_check
  failed_when: false
  changed_when: false

- name: Create external docker network
  ansible.builtin.command: docker network create {{ dockhand_network_name }}
  when: network_check.rc != 0

- name: Pull docker images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ dockhand_make_dir }}"
  when: service_state != 'absent'
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stdout"
  tags:
    - dockhand
    - up

- name: Start/Stop dockhand service
  community.docker.docker_compose_v2:
    project_src: "{{ dockhand_make_dir }}"
    state: "{{ service_state | default('present') }}"
    pull: missing
  register: dockhand_result
  failed_when: dockhand_result.failed and "No resource found to remove" not in dockhand_result.msg
  tags:
    - dockhand
    - up
    - down
    - restart
