server {
    listen 443 ssl;
    http2 on;
    server_name grafana.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_grafana grafana-server;
        proxy_pass http://$upstream_grafana:3000;
    }
}
