server {
    listen 443 ssl;
    http2 on;
    server_name tatuscan.ccbv.local;

    ssl_certificate /etc/nginx/certs/ccbv.local.crt;
    ssl_certificate_key /etc/nginx/certs/ccbv.local.key;

    location / {
        set $upstream_tatuscan tatuscan-app;
        proxy_pass http://$upstream_tatuscan:8040;
    }
    
    location /html/ {
        alias /usr/share/nginx/html/html/;
        internal;
    }
}
